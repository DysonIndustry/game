      <img src="logo.png" alt="" width="38" height="38">
      Dyson Game Hub

    <nav class="gh-nav__links" aria-label="Primary">

</header>
<main id="main">
  <section class="section" style="padding-top:32px;">
    <div class="container" style="max-width:720px;">
      <div id="results-header" class="section-head">
        <div class="state-box"><div class="spinner"></div><p>Loading game…</p></div>
      </div>

      <div id="results-search" class="hidden field" style="max-width:320px;">
        <label for="results-filter">Search player</label>
        <input type="text" id="results-filter" placeholder="Type a name…">
      </div>

      <div id="results-list"></div>
    </div>
  </section>
</main>

<footer class="gh-footer">
  <div class="container">
    <div class="gh-footer__bottom text-center" style="border-top:none;padding-top:0;">© <span data-year></span> Dyson Game Hub. Not affiliated with WhatsApp Inc. or Meta.</div>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="images.js"></script>
<script src="app.js"></script>
<script src="auth.js"></script>
<script src="sharing.js"></script>
<script src="sound.js"></script>
<script src="leaderboard.js"></script>
<script>
  (async function () {
    const gameId = GameHubApp.qs("game");
    const headerEl = document.getElementById("results-header");
    const listEl = document.getElementById("results-list");
    const searchWrap = document.getElementById("results-search");

    if (!gameId) {
      headerEl.innerHTML = `<h1>Game Results</h1><p>No game specified. Open this page from your <a href="profile.html">dashboard</a>.</p>`;
      return;
    }

    const { data: game, error } = await GameHubDB.getGameById(gameId);
    if (error || !game) {
      headerEl.innerHTML = `<h1>Game Results</h1>`;
      listEl.innerHTML = `<div class="state-box"><div class="state-box__icon">⚠️</div><h3>Couldn't load this game</h3><p>${GameHubApp.escapeHtml(error?.message || "It may have been deleted.")}</p></div>`;
      return;
    }

    headerEl.innerHTML = `
      <span class="badge">Code: ${game.share_code}</span>
      <h1 style="font-size:1.7rem;margin-top:8px;">${GameHubApp.escapeHtml(game.title)}</h1>
      <p>Everyone who has played this game, ranked by score.</p>
    `;

    const { data: results, error: resError } = await GameHubDB.getLeaderboard(game.id, 200);
    if (resError) {
      listEl.innerHTML = `<div class="state-box"><div class="state-box__icon">⚠️</div><h3>Couldn't load results</h3><p>${GameHubApp.escapeHtml(resError.message)}</p></div>`;
      return;
    }

    if (!results || results.length === 0) {
      listEl.innerHTML = `<div class="state-box"><div class="state-box__icon">🙈</div><h3>No players have completed this game yet.</h3><p>Share your game link to start collecting scores.</p></div>`;
      return;
    }

    searchWrap.classList.remove("hidden");
    listEl.innerHTML = `<div id="results-lb"></div>`;
    const lbEl = document.getElementById("results-lb");
    GameHubLeaderboard.renderInto(lbEl, results);

    document.getElementById("results-filter").addEventListener("input", (e) => {
      const term = e.target.value.trim().toLowerCase();
      const filtered = term
        ? results.filter((r) => (r.player_name || "").toLowerCase().includes(term))
        : results;
      GameHubLeaderboard.renderInto(lbEl, filtered, { emptyMessage: "No players match that search." });
    });
  })();
</script>
</body>
</html>
